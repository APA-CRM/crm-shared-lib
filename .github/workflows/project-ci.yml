name: Project CI

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}


on:
  push:
    branches:
      - main
      - snapshot
  pull_request:
    branches:
      - main
      - snapshot

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven

      - name: Run tests
        run: mvn clean verify